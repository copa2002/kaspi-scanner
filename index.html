<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17212b">
    <title>Сканер Kaspi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--tg-theme-bg-color, #f3f5f7);
        color: var(--tg-theme-text-color, #17212b);
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); background: var(--tg-theme-bg-color, #f3f5f7); color: var(--tg-theme-text-color, #17212b); }
      main { max-width: 520px; margin: 0 auto; }
      h1 { margin: 8px 0 6px; font-size: 1.55rem; letter-spacing: -.03em; }
      .intro { margin: 0 0 20px; color: var(--tg-theme-hint-color, #718096); line-height: 1.45; }
      .camera-stage { position: relative; width: 100%; max-height: 58vh; margin: 16px 0; overflow: hidden; border-radius: 20px; background: #111; box-shadow: 0 12px 32px rgb(22 34 48 / 16%); touch-action: none; }
      video { display: block; width: 100%; height: 100%; }
      .scan-region { position: absolute; box-sizing: border-box; border: 2px solid #35d07f; box-shadow: 0 0 0 999px rgb(0 0 0 / 48%); touch-action: none; cursor: move; }
      .scan-region:focus-visible { outline: 2px solid white; outline-offset: 3px; }
      .edge-handle { position: absolute; z-index: 1; box-sizing: border-box; min-width: 0; min-height: 0; padding: 0; margin: 0; border: 0; border-radius: 0; background: transparent; touch-action: none; }
      .edge-handle::after { position: absolute; display: block; content: ""; border-radius: 4px; background: #35d07f; }
      .edge-handle[data-edge="top"], .edge-handle[data-edge="bottom"] { right: 12px; left: 12px; width: auto; height: 14px; }
      .edge-handle[data-edge="top"] { top: -7px; cursor: ns-resize; }
      .edge-handle[data-edge="bottom"] { bottom: -7px; cursor: ns-resize; }
      .edge-handle[data-edge="top"]::after, .edge-handle[data-edge="bottom"]::after { top: 5px; right: 0; left: 0; height: 3px; }
      .edge-handle[data-edge="left"], .edge-handle[data-edge="right"] { top: 12px; bottom: 12px; width: 14px; }
      .edge-handle[data-edge="left"] { left: -7px; cursor: ew-resize; }
      .edge-handle[data-edge="right"] { right: -7px; cursor: ew-resize; }
      .edge-handle[data-edge="left"]::after, .edge-handle[data-edge="right"]::after { top: 0; bottom: 0; left: 5px; width: 3px; }
      button, input { width: 100%; min-height: 52px; margin: 6px 0; padding: 12px 16px; border: 0; border-radius: 14px; font: inherit; }
      button { color: var(--tg-theme-button-text-color, #fff); background: var(--tg-theme-button-color, #2481cc); font-weight: 650; box-shadow: 0 5px 16px rgb(36 129 204 / 20%); cursor: pointer; }
      button:active { transform: scale(.99); }
      input { color: var(--tg-theme-text-color, #17212b); background: var(--tg-theme-secondary-bg-color, #f1f1f1); }
      label { display: block; margin-top: 22px; font-size: .92rem; font-weight: 600; }
      #status { min-height: 1.5em; color: var(--tg-theme-hint-color, #718096); text-align: center; }
      #result[hidden], [hidden] { display: none !important; }
      #result {
        position: fixed;
        z-index: 5;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: max(18px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
        background: var(--tg-theme-bg-color, #f3f5f7);
      }
      #result h2 { flex: none; margin: 4px 0 0; font-size: 1.25rem; }
      #result-description { flex: none; margin: 0; color: var(--tg-theme-hint-color, #718096); }
      #result-image { display: block; flex: 1 1 auto; width: 100%; min-height: 0; object-fit: contain; border-radius: 18px; background: #101820; }
      #next { flex: none; margin: 0; }
      body.result-mode main > :not(#result) { display: none !important; }
      body.result-mode { overflow: hidden; padding: 0; }
      body.result-mode main { max-width: none; margin: 0; }
      #scan-flash { position: fixed; z-index: 10; inset: 0; pointer-events: none; background: white; opacity: 0; }
      #scan-flash.active { animation: scan-flash 180ms ease-out; }
      @keyframes scan-flash { 0% { opacity: 0; } 30% { opacity: .85; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #scan-flash.active { animation-duration: 80ms; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Сканер заказа</h1>
      <p class="intro">Наведите камеру на штрихкод или QR-код заказа. Найденный товар откроется на весь экран.</p>
      <div id="camera-stage" class="camera-stage" hidden>
        <video id="camera" autoplay muted playsinline></video>
        <div id="scan-region" class="scan-region" aria-label="Область сканирования">
          <button class="edge-handle" type="button" data-edge="top" aria-label="Потяните, чтобы изменить верхний край"></button>
          <button class="edge-handle" type="button" data-edge="right" aria-label="Потяните, чтобы изменить правый край"></button>
          <button class="edge-handle" type="button" data-edge="bottom" aria-label="Потяните, чтобы изменить нижний край"></button>
          <button class="edge-handle" type="button" data-edge="left" aria-label="Потяните, чтобы изменить левый край"></button>
        </div>
      </div>
      <button id="start" type="button">Сканировать заказ</button>
      <label for="manual">Ручной ввод кода или артикула</label>
      <input id="manual" autocomplete="off" inputmode="text" placeholder="Номер заказа / штрихкод">
      <button id="send" type="button">Найти заказ</button>
      <section id="result" aria-live="polite" hidden>
        <h2 id="result-title"></h2>
        <img id="result-image" alt="Фото товара" hidden>
        <p id="result-description"></p>
        <button id="next" type="button">Сканировать следующий заказ</button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <div id="scan-flash" aria-hidden="true"></div>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
    <script>
      const telegram = window.Telegram?.WebApp;
      telegram?.ready();
      telegram?.expand();

      const video = document.querySelector("#camera");
      const cameraStage = document.querySelector("#camera-stage");
      const scanRegion = document.querySelector("#scan-region");
      const status = document.querySelector("#status");
      const manual = document.querySelector("#manual");
      const startButton = document.querySelector("#start");
      const resultView = document.querySelector("#result");
      const resultTitle = document.querySelector("#result-title");
      const resultImage = document.querySelector("#result-image");
      const resultDescription = document.querySelector("#result-description");
      const nextButton = document.querySelector("#next");
      const scanFlash = document.querySelector("#scan-flash");
      const launchParams = new URLSearchParams(window.location.search);
      const apiBase = launchParams.get("api");
      const sessionToken = launchParams.get("session");
      const scanCanvas = document.createElement("canvas");
      const scanContext = scanCanvas.getContext("2d", { willReadFrequently: true });
      const MIN_REGION_SIZE = 0.16;
      let region = { x: 0.16, y: 0.28, width: 0.68, height: 0.42 };
      let stream;
      let detector;
      let zxReader;
      let scanning = false;
      let submitting = false;

      function renderRegion() {
        scanRegion.style.left = `${region.x * 100}%`;
        scanRegion.style.top = `${region.y * 100}%`;
        scanRegion.style.width = `${region.width * 100}%`;
        scanRegion.style.height = `${region.height * 100}%`;
      }

      function bindRegionGestures() {
        let drag;
        scanRegion.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          event.preventDefault();
          const edge = event.target.closest("[data-edge]")?.dataset.edge || "move";
          drag = {
            pointerId: event.pointerId,
            edge,
            clientX: event.clientX,
            clientY: event.clientY,
            start: { ...region }
          };
          scanRegion.setPointerCapture(event.pointerId);
        });

        scanRegion.addEventListener("pointermove", event => {
          if (!drag || drag.pointerId !== event.pointerId) return;
          const bounds = cameraStage.getBoundingClientRect();
          const dx = (event.clientX - drag.clientX) / bounds.width;
          const dy = (event.clientY - drag.clientY) / bounds.height;
          const start = drag.start;

          if (drag.edge === "move") {
            region = {
              ...start,
              x: Math.min(1 - start.width, Math.max(0, start.x + dx)),
              y: Math.min(1 - start.height, Math.max(0, start.y + dy))
            };
          } else if (drag.edge === "left") {
            const right = start.x + start.width;
            const left = Math.min(right - MIN_REGION_SIZE, Math.max(0, start.x + dx));
            region = { ...start, x: left, width: right - left };
          } else if (drag.edge === "right") {
            region.width = Math.max(
              MIN_REGION_SIZE,
              Math.min(1 - start.x, start.width + dx)
            );
          } else if (drag.edge === "top") {
            const bottom = start.y + start.height;
            const top = Math.min(bottom - MIN_REGION_SIZE, Math.max(0, start.y + dy));
            region = { ...start, y: top, height: bottom - top };
          } else if (drag.edge === "bottom") {
            region.height = Math.max(
              MIN_REGION_SIZE,
              Math.min(1 - start.y, start.height + dy)
            );
          }
          renderRegion();
        });

        const stopDragging = event => {
          if (drag?.pointerId === event.pointerId) drag = undefined;
        };
        scanRegion.addEventListener("pointerup", stopDragging);
        scanRegion.addEventListener("pointercancel", stopDragging);
      }

      function getScanFrame() {
        const sourceWidth = video.videoWidth;
        const sourceHeight = video.videoHeight;
        const left = Math.round(region.x * sourceWidth);
        const top = Math.round(region.y * sourceHeight);
        const width = Math.max(1, Math.round(region.width * sourceWidth));
        const height = Math.max(1, Math.round(region.height * sourceHeight));
        if (scanCanvas.width !== width || scanCanvas.height !== height) {
          scanCanvas.width = width;
          scanCanvas.height = height;
        }
        scanContext.drawImage(video, left, top, width, height, 0, 0, width, height);
        return scanCanvas;
      }

      function isDecodeMiss(error) {
        const kind = error?.constructor?.kind || error?.name;
        return ["NotFoundException", "ChecksumException", "FormatException"].includes(kind);
      }

      function stopCamera() {
        scanning = false;
        stream?.getTracks().forEach(track => track.stop());
        stream = undefined;
        video.srcObject = null;
        detector = undefined;
        zxReader = undefined;
      }

      function flashAfterScan() {
        scanFlash.classList.remove("active");
        void scanFlash.offsetWidth;
        scanFlash.classList.add("active");
        window.setTimeout(() => scanFlash.classList.remove("active"), 220);
      }

      function showResult(result) {
        stopCamera();
        cameraStage.hidden = true;
        resultTitle.textContent = result.order_number
          ? `Заказ ${result.order_number}`
          : result.error ? "Заказ не найден" : "Результат поиска";
        resultDescription.textContent = result.product_name || result.error || "";
        resultImage.hidden = !result.image;
        if (result.image) {
          resultImage.src = `data:${result.image_type || "image/png"};base64,${result.image}`;
        } else {
          resultImage.removeAttribute("src");
        }
        resultView.hidden = false;
        document.body.classList.add("result-mode");
        nextButton.textContent = result.error
          ? "Попробовать ещё раз"
          : "Сканировать следующий заказ";
        status.textContent = "";
      }

      async function submit(value) {
        const code = value.trim();
        if (!code) {
          status.textContent = "Введите или отсканируйте код.";
          return;
        }
        scanning = false;
        stopCamera();
        cameraStage.hidden = true;
        if (!apiBase || !sessionToken) {
          if (telegram) {
            telegram.sendData(code);
          } else {
            status.textContent = `Код: ${code}. Откройте страницу из Telegram-бота.`;
          }
          return;
        }
        if (submitting) return;
        submitting = true;
        status.textContent = "Ищу заказ в PDF-листе на компьютере…";
        try {
          const apiUrl = new URL("/api/lookup", apiBase);
          if (apiUrl.protocol !== "https:") {
            throw new Error("Для API требуется HTTPS.");
          }
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${sessionToken}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ code })
          });
          const result = await response.json();
          if (!response.ok) {
            showResult({ error: result.error || "Не удалось найти заказ." });
          } else {
            showResult(result);
          }
        } catch (error) {
          showResult({
            error: "Не удалось подключиться к компьютеру. Проверьте, что бот и HTTPS-туннель запущены."
          });
        } finally {
          submitting = false;
        }
      }

      async function startCamera() {
        if (scanning) return;
        resultView.hidden = true;
        document.body.classList.remove("result-mode");
        manual.value = "";
        if (stream) {
          scanning = true;
          status.textContent = "Камера включена. Наведите рамку на следующий код.";
          requestAnimationFrame(scanFrame);
          return;
        }
        if (!navigator.mediaDevices?.getUserMedia) {
          status.textContent = "Браузер не предоставляет доступ к камере. Введите код вручную.";
          return;
        }
        try {
          cameraStage.hidden = false;
          if ("BarcodeDetector" in window) {
            const supported = await BarcodeDetector.getSupportedFormats();
            const formats = ["qr_code", "ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"]
              .filter(format => supported.includes(format));
            if (!formats.length) {
              throw new Error("No supported barcode formats");
            }
            detector = new BarcodeDetector({ formats });
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { ideal: "environment" } }
            });
            video.srcObject = stream;
            await video.play();
            cameraStage.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
            scanning = true;
            startButton.hidden = true;
            status.textContent = "Камера включена. Настройте рамку и наведите её на код.";
            requestAnimationFrame(scanFrame);
          } else if (window.ZXingBrowser?.BrowserMultiFormatReader) {
            zxReader = new ZXingBrowser.BrowserMultiFormatReader();
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { ideal: "environment" } }
            });
            video.srcObject = stream;
            await video.play();
            cameraStage.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
            scanning = true;
            startButton.hidden = true;
            status.textContent = "Камера включена. Настройте рамку и наведите её на код.";
            requestAnimationFrame(scanFrame);
          } else {
            throw new Error("Scanner library did not load");
          }
        } catch (error) {
          stopCamera();
          status.textContent = error.name === "NotAllowedError"
            ? "Нет разрешения на камеру. Разрешите доступ или введите код вручную."
            : "Не удалось запустить камеру. Проверьте HTTPS и разрешение браузера.";
        }
      }

      async function scanFrame() {
        if (!scanning || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          if (scanning) requestAnimationFrame(scanFrame);
          return;
        }
        try {
          const frame = getScanFrame();
          let rawValue;
          if (detector) {
            const codes = await detector.detect(frame);
            rawValue = codes[0]?.rawValue;
          } else {
            rawValue = zxReader.decodeFromCanvas(frame).getText();
          }
          if (rawValue) {
            scanning = false;
            flashAfterScan();
            status.textContent = "Код считан. Ищу заказ…";
            cameraStage.hidden = true;
            stopCamera();
            await new Promise(resolve => window.setTimeout(resolve, 1000));
            await submit(rawValue);
            return;
          }
        } catch (error) {
          if (!isDecodeMiss(error)) {
            status.textContent = "Не удалось прочитать кадр. Попробуйте ручной ввод.";
          }
        }
        if (scanning) requestAnimationFrame(scanFrame);
      }

      startButton.addEventListener("click", startCamera);
      nextButton.addEventListener("click", startCamera);

      document.querySelector("#send").addEventListener("click", () => submit(manual.value));
      manual.addEventListener("keydown", event => {
        if (event.key === "Enter") submit(manual.value);
      });
      renderRegion();
      bindRegionGestures();
      window.addEventListener("pagehide", stopCamera);
    </script>
  </body>
</html>
