<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17212b">
    <title>Сканер Kaspi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 20px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #17212b); }
      main { max-width: 520px; margin: auto; }
      h1 { font-size: 1.35rem; }
      video { display: block; width: 100%; max-height: 58vh; margin: 16px 0; background: #111; border-radius: 12px; object-fit: cover; }
      button, input { box-sizing: border-box; width: 100%; min-height: 48px; margin: 6px 0; padding: 10px 12px; border: 0; border-radius: 10px; font: inherit; }
      button { color: var(--tg-theme-button-text-color, #fff); background: var(--tg-theme-button-color, #2481cc); }
      input { color: var(--tg-theme-text-color, #17212b); background: var(--tg-theme-secondary-bg-color, #f1f1f1); }
      #status { min-height: 1.5em; opacity: .8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Сканер заказа</h1>
      <p>Наведите камеру на QR-код или штрихкод. Если камера или формат не поддерживаются, введите код вручную.</p>
      <video id="camera" autoplay muted playsinline hidden></video>
      <button id="start" type="button">Открыть камеру</button>
      <label for="manual">Ручной ввод кода или артикула</label>
      <input id="manual" autocomplete="off" inputmode="text" placeholder="Номер заказа / штрихкод">
      <button id="send" type="button">Найти заказ</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
    <script>
      const telegram = window.Telegram?.WebApp;
      telegram?.ready();
      telegram?.expand();

      const video = document.querySelector("#camera");
      const status = document.querySelector("#status");
      const manual = document.querySelector("#manual");
      let stream;
      let detector;
      let scannerControls;
      let scanning = false;

      function stopCamera() {
        scanning = false;
        scannerControls?.stop();
        stream?.getTracks().forEach(track => track.stop());
        stream = undefined;
      }

      function submit(value) {
        const code = value.trim();
        if (!code) {
          status.textContent = "Введите или отсканируйте код.";
          return;
        }
        if (telegram) {
          telegram.sendData(code);
        } else {
          status.textContent = `Код: ${code}. Откройте страницу из Telegram-бота.`;
        }
      }

      async function scanFrame() {
        if (!scanning || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          if (scanning) requestAnimationFrame(scanFrame);
          return;
        }
        try {
          const codes = await detector.detect(video);
          if (codes.length && codes[0].rawValue) {
            stopCamera();
            submit(codes[0].rawValue);
            return;
          }
        } catch {
          status.textContent = "Не удалось прочитать код. Попробуйте ручной ввод.";
        }
        if (scanning) requestAnimationFrame(scanFrame);
      }

      document.querySelector("#start").addEventListener("click", async () => {
        if (!navigator.mediaDevices?.getUserMedia) {
          status.textContent = "Браузер не предоставляет доступ к камере. Введите код вручную.";
          return;
        }
        try {
          video.hidden = false;
          if ("BarcodeDetector" in window) {
            const supported = await BarcodeDetector.getSupportedFormats();
            const formats = ["qr_code", "ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"]
              .filter(format => supported.includes(format));
            if (!formats.length) {
              throw new Error("No supported barcode formats");
            }
            detector = new BarcodeDetector({ formats });
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { ideal: "environment" } }
            });
            video.srcObject = stream;
            await video.play();
            scanning = true;
            status.textContent = "Камера включена. Наведите её на код.";
            requestAnimationFrame(scanFrame);
          } else if (window.ZXingBrowser?.BrowserMultiFormatReader) {
            const reader = new ZXingBrowser.BrowserMultiFormatReader();
            scannerControls = await reader.decodeFromConstraints(
              { audio: false, video: { facingMode: { ideal: "environment" } } },
              video,
              result => {
                if (result) {
                  stopCamera();
                  submit(result.getText());
                }
              }
            );
            status.textContent = "Камера включена. Наведите её на код.";
          } else {
            throw new Error("Scanner library did not load");
          }
        } catch (error) {
          stopCamera();
          status.textContent = error.name === "NotAllowedError"
            ? "Нет разрешения на камеру. Разрешите доступ или введите код вручную."
            : "Не удалось запустить камеру. Проверьте HTTPS и разрешение браузера.";
        }
      });

      document.querySelector("#send").addEventListener("click", () => submit(manual.value));
      manual.addEventListener("keydown", event => {
        if (event.key === "Enter") submit(manual.value);
      });
      window.addEventListener("pagehide", stopCamera);
    </script>
  </body>
</html>
